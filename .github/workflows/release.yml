name: Release

# Push a tag like v1.2.0, push a branch named release/1.2.0, or run manually
# with a version, to build a signed release APK and publish it as a GitHub
# Release. For branch and manual runs the workflow creates the tag itself.
# The in-app updater reads the latest release through the GitHub API.
on:
  push:
    tags: ["v*"]
    branches: ["release/*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (a tag v<version> is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          FROM_TAG=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            FROM_TAG=true
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "from_tag=$FROM_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 is not set; the APK will be signed with the debug key. See README > Releases and signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build signed release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/KRS-Location-${{ steps.version.outputs.version }}.apk"

      - name: Verify signature
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs dist/*.apk

      - name: Create tag (branch and manual runs)
        if: steps.version.outputs.from_tag != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.version.outputs.tag }}"
          git push -f origin "${{ steps.version.outputs.tag }}"

      - name: Write release notes header
        run: |
          {
            echo "Download **KRS-Location-${{ steps.version.outputs.version }}.apk** below and install it on Android 8.0 or newer."
            echo "Then enable Developer options and choose KRS Location under *Select mock location app*."
            echo
            if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
              echo "> **Note:** this build is signed with the debug key because the repository has no release keystore secrets yet."
              echo "> Once signed releases start, this version must be uninstalled before updating."
              echo
            fi
          } > dist/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KRS Location ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          generate_release_notes: true
          files: dist/*.apk
